# SPDX-License-Identifier: GPL-3.0-or-later
#
# caliper-cast — Output encoders (SVG, PDF, EPS, DXF and later AI/GeoJSON/HPGL).
# See PRD §8.8 and PRD §13.2.

[package]
name        = "caliper-cast"
description = "Output encoders for Caliper — SVG, PDF, EPS, DXF, and more."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true

[features]
default = ["svg"]
svg     = []
pdf     = ["dep:pdf-writer"]
eps     = []
dxf     = []
ai      = []
geojson = ["dep:serde_json"]
hpgl    = []
all     = ["svg", "pdf", "eps", "dxf", "ai", "geojson", "hpgl"]

[dependencies]
quick-xml  = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true, optional = true }
pdf-writer = { workspace = true, optional = true }
thiserror  = { workspace = true }
image      = { workspace = true }

[lints]
workspace = true
