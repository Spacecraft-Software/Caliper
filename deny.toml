# SPDX-License-Identifier: GPL-3.0-or-later
#
# cargo-deny configuration for Caliper.
# Run: `cargo deny check` (advisories, bans, licenses, sources)

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Allow-list — every license below is compatible with GPL-3.0-or-later
# downstream distribution. Anything else fails the check.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OFL-1.1",
    "MPL-2.0",
]
confidence-threshold = 0.93
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# No proc-macro crates beyond clap and serde (PRD §16).
# Any new proc-macro dependency must be added here explicitly with a reason.
deny = [
    { name = "openssl-sys", reason = "Prefer rustls; openssl pulls in C." },
    { name = "openssl", reason = "Prefer rustls." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
