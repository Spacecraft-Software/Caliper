#
# xtask — Cross-cutting build / audit / housekeeping binary. Invoked via
# `cargo xtask <subcommand>` (alias in `.cargo/config.toml`).

[package]
name        = "xtask"
description = "Cross-cutting build and audit tasks for the Caliper workspace."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
publish                = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap   = { workspace = true }
jiff   = { workspace = true }

[lints]
workspace = true
